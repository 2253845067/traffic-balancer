# 流量对等脚本配置
# 修改后立即生效（cron 每次运行都会重新读取）

# 统计网卡：auto = 跟随默认路由网卡
IFACE=auto

# 统计方向：tx=上行/出网（阿里云轻量计费口径），rx=下行/入网，total=双向合计
# 本脚本制造的是“下行”流量，默认按 tx 计算，避免自己下载的数据放大下一小时的目标
DIRECTION=tx

# 目标下载量 = 上一个小时流量 / RATIO。3 即 1/3
RATIO=3

# 每次运行分几段下载（下限/上限）
MIN_COUNT=1
MAX_COUNT=2

# 下载直链，空格分隔。可以写多个，脚本按小时轮换，单个源失效会自动换下一个
# 大小会通过 HTTP HEAD 自动探测并缓存 7 天，无需手工填写
# 尽量选支持 Range（Accept-Ranges: bytes）的源，这样 TRIM_LAST 才能精确截取
DOWNLOAD_URLS="
https://dldir1.qq.com/weixin/Windows/WeChatSetup.exe
https://mirrors.tuna.tsinghua.edu.cn/ubuntu-releases/24.04.3/ubuntu-24.04.3-live-server-amd64.iso
https://mirrors.nju.edu.cn/ubuntu-releases/24.04.3/ubuntu-24.04.3-live-server-amd64.iso
"

# 探测不到文件大小（无 Content-Length）时使用的兜底字节数，仅影响段内截取与磁盘预估
FALLBACK_PKG_SIZE=283125176

# 1=最后一段按“还差多少”截取（支持 Range 的源上可精确到 1/3）
# 0=只下完整文件（比例会更粗）
TRIM_LAST=1

# 上小时流量低于该值时本次不下载，避免服务器空跑反而堆出多余的入网流量；设 0 关闭
SKIP_BELOW_MB=60

# 单次运行最多下载的 MB
MAX_PULL_MB_PER_RUN=1200

# 限速（curl --limit-rate 格式，如 "30m" 表示 30MB/s），留空为不限速
LIMIT_RATE=""

# 单次下载超时秒数
CURL_MAX_TIME=1800

# 文件大小缓存有效期（天）
SIZE_CACHE_TTL_DAYS=7
